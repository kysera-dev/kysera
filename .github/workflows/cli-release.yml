name: CLI Release

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-setuptools python-is-python3 make g++ build-essential

      - name: Install dependencies
        env:
          PYTHON: python3
        run: |
          pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          cd apps/cli
          pnpm test:unit
          pnpm test:integration

      - name: Build
        run: |
          cd apps/cli
          pnpm build

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-setuptools python-is-python3 make g++ build-essential

      - name: Install dependencies
        env:
          PYTHON: python3
        run: |
          pnpm install --frozen-lockfile

      - name: Build CLI
        run: |
          cd apps/cli
          pnpm build

      - name: Configure npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          npm config set access public

      - name: Publish to npm
        run: |
          cd apps/cli
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: '@kysera/cli v${{ github.event.inputs.version || github.ref_name }}'
          body: |
            ## What's Changed

            See [CHANGELOG.md](https://github.com/kysera/kysera/blob/main/apps/cli/CHANGELOG.md) for details.

            ## Installation

            ```bash
            npm install -g @kysera/cli@${{ github.event.inputs.version || github.ref_name }}
            ```

            ## Quick Start

            ```bash
            kysera init my-app --dialect postgres
            ```
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            apps/cli/dist/**
            apps/cli/README.md
            apps/cli/CHANGELOG.md

  docker:
    name: Build Docker Image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/cli
          push: true
          tags: |
            ghcr.io/kysera/cli:latest
            ghcr.io/kysera/cli:${{ github.event.inputs.version || github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/kysera/kysera
            org.opencontainers.image.description=Kysera CLI - Comprehensive CLI for Kysera ORM
            org.opencontainers.image.version=${{ github.event.inputs.version || github.ref_name }}
