# Non-gating benchmark run: manual dispatch + weekly cron only. Deliberately
# not wired into PR checks — the numbers are informational (relative overhead
# indicators, see bench/README.md), not a merge gate.
name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    # Mondays 05:17 UTC — off-peak, avoids top-of-hour cron congestion
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    name: Run benchmark suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run benchmarks
        run: pnpm bench

      - name: Publish results to job summary
        run: cat bench/RESULTS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload RESULTS.md artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: bench/RESULTS.md
          if-no-files-found: error
