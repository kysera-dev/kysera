packages:
  - packages/*
  - apps/*
  - examples/*
  - website
  - bench

allowBuilds:
  better-sqlite3: true
  esbuild: true
  "@swc/core": true
  core-js: false
  sharp: false
  unrs-resolver: true

# Upstream consumers still select vulnerable historical majors. Keep each
# replacement scoped to the affected dependency and its supported API.
minimumReleaseAgeStrict: true

overrides:
  '@docusaurus/core>tinypool': ^2.1.2
  'serialize-javascript@6': ^7.1.3
  'sockjs>uuid': ^11.1.1
  'minimatch@10': ^11.0.3
  'serve-handler>minimatch': ^11.0.3

patchedDependencies:
  serve-handler@6.1.7: patches/serve-handler@6.1.7.patch
